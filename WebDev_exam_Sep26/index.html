<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard · TrueCount</title>

  <meta name="description" content="Your TrueCount dashboard: cards counted, sessions saved, peak true count and the shoe you left in progress.">
  <meta name="keywords" content="blackjack dashboard, card counting practice, running count, true count, hi-lo">
  <meta name="author" content="Andrei Bertea">
  <meta name="theme-color" content="#08120e">
  <link rel="canonical" href="index.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="TrueCount — Blackjack Card Counting Trainer">
  <meta property="og:description" content="Track a live running and true count across five counting systems, and learn the index plays that matter.">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e3b95f'/><text x='16' y='24' font-size='22' text-anchor='middle' fill='%230b1a13'>♠</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header></header>

  <main class="page" id="main">
    <div class="container stack stack--wide">

      <!-- Hero -->
      <section class="hero">
        <div class="hero__body">
          <p class="section-label">Dashboard</p>
          <h1 id="greeting">Welcome back</h1>
          <p class="lede" id="greeting-sub">Pick up where you left off, or start something new.</p>
          <div class="row row--tight" style="margin-top:1.5rem">
            <a class="btn btn--primary btn--lg" href="counter.html">Open the live count</a>
            <a class="btn btn--lg" href="learn.html">Systems &amp; strategy</a>
          </div>
        </div>

        <aside class="hero__aside">
          <div class="card" style="background:rgba(8,18,14,.45)">
            <p class="section-label">Shoe in progress</p>
            <div id="shoe-status">
              <p class="muted" style="font-size:.875rem">No shoe open.</p>
            </div>
          </div>
        </aside>
      </section>

      <!-- Stats -->
      <section aria-labelledby="stats-heading">
        <h2 id="stats-heading">Your numbers</h2>
        <div class="stat-row" id="stat-row"></div>
      </section>

      <!-- Counting systems -->
      <section class="card" aria-labelledby="systems-heading">
        <div class="card__header">
          <h2 class="card__title" id="systems-heading">Counting systems</h2>
          <a class="btn btn--sm btn--ghost" href="learn.html">Compare all</a>
        </div>
        <ul class="list" id="systems-list"></ul>
      </section>

      <!-- Activity feed -->
      <section class="card" aria-labelledby="activity-heading">
        <div class="card__header">
          <h2 class="card__title" id="activity-heading">Recent activity</h2>
          <button class="btn btn--sm btn--danger" type="button" id="clear-activity">Clear all</button>
        </div>

        <div class="chip-row" id="activity-filters" role="group" aria-label="Filter activity">
          <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="chip" type="button" data-filter="counter" aria-pressed="false">Counting</button>
          <button class="chip" type="button" data-filter="profile" aria-pressed="false">Profile</button>
          <button class="chip" type="button" data-filter="auth" aria-pressed="false">Account</button>
        </div>

        <ul class="list scroll-y" id="activity-list" style="margin-top:1rem" aria-live="polite"></ul>
      </section>

    </div>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <div class="toast-stack" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
